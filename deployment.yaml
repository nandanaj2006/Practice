apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exam-portal
  template:
    metadata:
      labels:
        app: exam-portal
    spec:
      containers:
      - name: exam-portal
        image: Nandana200621/exam-portal:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: exam-portal-service
spec:
  type: NodePort
  selector:
    app: exam-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010
